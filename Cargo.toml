[package]
name = "freezy"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
fuzzy-matcher = "0.3"
git2 = "0.20"
futures = "0.3"
unicode-width = "0.2"
syntect = { version = "5", default-features = false, features = ["parsing", "regex-onig"] }
two-face = "0.5"

[profile.release]
strip = true
lto = "thin"
